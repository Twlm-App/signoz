name: twlm-image

# Publishes the TWLM build of SigNoz (see twlm/README.md) to GHCR.
on:
  workflow_dispatch:
  push:
    branches: ["twlm/**"]
    paths: ["frontend/**", "twlm/**", ".github/workflows/twlm-image.yaml"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: twlm/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/twlm-app/signoz:v0.142.1-twlm.${{ github.run_number }}
            ghcr.io/twlm-app/signoz:v0.142.1-twlm
          cache-from: type=gha
          cache-to: type=gha,mode=max
